<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUICK RASHI — Mobile Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font:15px system-ui;background:#eef5ff;color:#193858;margin:0;padding:14px}main{max-width:460px;margin:auto;background:white;padding:20px;border-radius:18px;box-shadow:0 6px 24px #1232}h2{color:#087bbd}button{background:#087bbd;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;margin:5px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #aac;border-radius:8px}#reader{margin:15px 0}#status{padding:10px;background:#eaf6eb;border-radius:8px;min-height:50px}</style>
</head><body><main><h2>▥ QUICK RASHI Scanner</h2><p>Secure HTTPS page. This scanner uses a temporary pairing token from the main voucher.</p>
<div id="reader"></div><div><button id="start">📷 Enable Camera</button><button id="stop">Stop</button></div>
<label>Manual / USB barcode input</label><input id="code" placeholder="Scan or type barcode" autocomplete="off">
<button id="send">＋ Add to List</button><h3>Scanned Barcodes</h3><div id="count">0 items</div><div id="scanned-list"></div><button id="confirm" style="background:#148348">✓ Save / Send All to Voucher</button><button id="clear" style="background:#b91c1c">Clear List</button><p id="status">Tap Enable Camera and allow browser permission.</p>
</main><script>
const qs=new URLSearchParams(location.search),token=qs.get('token')||'',endpoint=qs.get('endpoint')||'';
let scanner=null,rows=[],last='',lastTime=0,sending=false;
const el=id=>document.getElementById(id),status=m=>el('status').textContent=m;
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C(),osc=ctx.createOscillator(),g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.frequency.value=880;g.gain.setValueAtTime(.15,ctx.currentTime);osc.start();osc.stop(ctx.currentTime+.12);osc.onended=()=>ctx.close();}catch(e){}try{navigator.vibrate?.(60)}catch(e){}}
function draw(){el('count').textContent=rows.reduce((n,r)=>n+r.qty,0)+' scans • '+rows.length+' different barcodes';el('scanned-list').innerHTML='';rows.forEach((r,i)=>{const d=document.createElement('div');d.style='display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;padding:8px;gap:8px';let code=document.createElement('span');code.textContent=r.code+' × '+r.qty;code.style='overflow-wrap:anywhere;flex:1';let b=document.createElement('button');b.textContent='Delete';b.style.background='#d12424';b.onclick=()=>{rows.splice(i,1);draw();};d.append(code,b);el('scanned-list').append(d);});}
function add(code){code=String(code||'').trim();if(!code)return status('Barcode missing');let r=rows.find(r=>r.code===code);if(r)r.qty++;else rows.push({code,qty:1});beep();status('✓ SCAN DONE: '+code);draw();}
async function confirmAll(){if(sending||!rows.length)return status('Nothing to send');if(!token||!endpoint.startsWith('https://'))return status('Scanner not paired. Open link from QUICK RASHI voucher.');sending=true;el('confirm').disabled=true;let sent=0;try{for(const r of rows){for(let i=0;i<r.qty;i++){let form=new URLSearchParams({action:'QR_SCANNER_PUSH',token,barcode:r.code});await fetch(endpoint,{method:'POST',mode:'no-cors',body:form});sent++;}}status('Submitted '+sent+' scans. Check main voucher for confirmation; browser cannot verify server receipt.');rows=[];draw();}catch(e){status('Network problem: '+(e.message||e)+'. Confirm voucher before retrying to avoid duplicates.');}finally{sending=false;el('confirm').disabled=false;}}
async function stop(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null;}}
el('start').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia)return status('Camera unavailable. Open HTTPS page in mobile browser.');if(!window.Html5Qrcode)return status('Scanning library unavailable.');try{await stop();status('Requesting camera permission…');const cams=await Html5Qrcode.getCameras();if(!cams.length)throw Error('No camera');const cam=cams.find(x=>/back|rear|environment/i.test(x.label))||cams[0];scanner=new Html5Qrcode('reader');await scanner.start(cam.id,{fps:8,qrbox:{width:220,height:150}},code=>{let t=Date.now();if(code===last&&t-lastTime<1500)return;last=code;lastTime=t;add(code);},()=>{});status('Camera ready. Scan barcodes; then Save / Send All.');}catch(e){status('Camera error: '+(e.message||e));}};
el('stop').onclick=stop;el('send').onclick=()=>{add(el('code').value);el('code').value='';};el('code').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el('send').click();}};el('confirm').onclick=confirmAll;el('clear').onclick=()=>{rows=[];draw();status('List cleared.');};draw();
</script></body></html>
